input {
  file {
    path => "/var/log/task-management/app.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => json
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "task-management-%{+YYYY.MM.dd}"
  }
  stdout {
    codec => rubydebug
  }
}
