name: CI and release deployment

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Test release-tag action
        run: node --test .github/actions/validate-release-tag/test.mjs
      - name: Lint backend
        run: npm run lint:backend
      - name: Lint frontend
        run: npm run lint:frontend
      - name: Test backend
        run: npm run test:backend
      - name: Test frontend
        run: npm run test:frontend
      - name: Build backend
        run: npm run build:backend
      - name: Build frontend
        run: npm run build:frontend

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production and development dependencies
        run: npm audit --audit-level=high
      - name: Review pull request dependencies
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4

  docker-build:
    name: Build container images
    runs-on: ubuntu-latest
    needs: [test, dependency-audit]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: task-management-backend:ci
      - name: Scan backend image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: task-management-backend:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          load: true
          tags: task-management-frontend:ci
          build-args: |
            VITE_API_URL=/api
      - name: Scan frontend image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: task-management-frontend:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Scan deployment configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL

  publish-images:
    name: Publish container images
    runs-on: ubuntu-latest
    needs: [test, dependency-audit, docker-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate tagged release before publishing
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ./.github/actions/validate-release-tag
        with:
          tag: ${{ github.ref_name }}
      - name: Ensure the release commit is on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch origin main --quiet
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD || {
            echo "::error::Release tags must point to a commit on main."
            exit 1
          }
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract backend image metadata
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/thanh-ha-nguyen/hh-sof018as3ae-3001_devops-technologies_task-manage-backend
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          provenance: false
      - name: Extract frontend image metadata
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/thanh-ha-nguyen/hh-sof018as3ae-3001_devops-technologies_task-manage-frontend
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=/api
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          provenance: false

  deploy:
    name: Deploy tagged release to Render
    runs-on: ubuntu-latest
    needs: [test, dependency-audit, docker-build, publish-images]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Ensure the release commit is on main
        run: |
          git fetch origin main --quiet
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD || {
            echo "::error::Release tags must point to a commit on main."
            exit 1
          }
      - name: Validate semantic release tag
        uses: ./.github/actions/validate-release-tag
        with:
          tag: ${{ github.ref_name }}
      - name: Trigger Render backend deployment
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::error::Set the RENDER_BACKEND_DEPLOY_HOOK_URL production secret before publishing a release tag."
            exit 1
          fi
          curl --fail --silent --show-error --request POST --get \
            --data-urlencode "imgURL=ghcr.io/thanh-ha-nguyen/hh-sof018as3ae-3001_devops-technologies_task-manage-backend:${GITHUB_REF_NAME}" \
            "$DEPLOY_HOOK_URL"
      - name: Trigger Render frontend deployment
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::error::Set the RENDER_FRONTEND_DEPLOY_HOOK_URL production secret before publishing a release tag."
            exit 1
          fi
          curl --fail --silent --show-error --request POST --get \
            --data-urlencode "imgURL=ghcr.io/thanh-ha-nguyen/hh-sof018as3ae-3001_devops-technologies_task-manage-frontend:${GITHUB_REF_NAME}" \
            "$DEPLOY_HOOK_URL"
